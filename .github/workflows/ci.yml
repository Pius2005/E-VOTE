name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sugvote
          POSTGRES_PASSWORD: sugvote
          POSTGRES_DB: sugvote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sugvote -d sugvote_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sugvote:sugvote@localhost:5432/sugvote_test
      DIRECT_URL: postgresql://sugvote:sugvote@localhost:5432/sugvote_test
      RUN_DB_TESTS: "1"
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      OTP_PEPPER: ci-otp-pepper-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all backend files
        run: |
          find src api scripts tests -name "*.js" -print0 | xargs -0 -n1 node --check
          find public/js -name "*.js" ! -path "*/vendor/*" -print0 | xargs -0 -n1 node --check
          node --check server.js

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
